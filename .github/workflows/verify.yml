name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Verify
        run: ./scripts/verify.sh
        env:
          XCODE_DESTINATION: "platform=iOS Simulator,name=iPhone 16"
